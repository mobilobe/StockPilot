name: inventory
description: "A cross-platform inventory, order, sales, and reporting app."
publish_to: 'none'
version: 1.0.7+6

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  excel: ^4.0.6
  file_selector: ^1.0.3
  fl_chart: ^0.68.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  file_saver: ^0.3.1
  firebase_core: ^4.15.0
  firebase_core_web: ^3.12.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/stock_pilot_icon.png"
  adaptive_icon_foreground: "assets/stock_pilot_icon.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true
